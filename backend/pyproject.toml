[project]
name = "procurement-agent-backend"
version = "0.1.0"
description = "Procurement AI Agent Workbench - backend (P0: skeleton, event bus, SSE, LLM gateway)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "sqlalchemy[asyncio]>=2.0.35",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3.5",
  "alembic>=1.13",
  "pyyaml>=6.0",
  # 数据工厂 / 文档处理（W1 起）
  "reportlab>=4.2",
  "pillow>=10.4",
  "pypdfium2>=4.30",
  "pdfplumber>=0.11",
  # M3 行对齐（匈牙利指派）
  "scipy>=1.14",
  # Agent 图编排（M3 matching graph；W2/W3 复用）
  "langgraph>=0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
  "integration: requires a live PostgreSQL (docker compose up -d db); skipped automatically when unreachable",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
