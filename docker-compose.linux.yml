# Linux 虚拟机部署用 Compose（Docker Engine + Compose v2）
#
# 用法（在仓库根目录）：
#   1) 可选：cp deploy.env.example .env   # 改数据库密码 / 端口 / 真实模型 key
#   2) docker compose -f docker-compose.linux.yml up -d --build
#   3) docker compose -f docker-compose.linux.yml exec api python scripts/seed.py --seed 42
#   4) 浏览器打开 http://<VM_IP>:8000
#
# 说明：
# - db 不映射到宿主机端口（只在 compose 内网），需要临时连库用：
#   docker compose -f docker-compose.linux.yml exec db psql -U app -d procurement
# - 首次 build 需要能访问 Docker Hub / PyPI / npm；内存建议 ≥2GB，磁盘 ≥5GB。
# - 真实模型：在 .env 中 FORCE_FAKE_LLM=0 并填 DEEPSEEK_API_KEY（或 ZHIPU_API_KEY）；
#   不填就是离线 FakeLLM 演示模式，不产生 API 费用。
# - 演示角色用 X-Demo-Role 模拟，不是真实认证：公网部署请放在 VPN/内网，或前面加 Nginx/Caddy + SSO/TLS。

name: procurement-workbench

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-procurement}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: procurement-workbench:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    environment:
      APP_ENV: ${APP_ENV:-prod}
      # 注意：密码里若含 @ : / 等字符，请先 URL-encode（或改用简单密码）
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-procurement}"
      DB_CONNECT_TIMEOUT_S: "1.5"
      FORCE_FAKE_LLM: ${FORCE_FAKE_LLM:-1}
      # OpenCode Go（OpenAI 兼容）；默认离线，填 key 后把 FORCE_FAKE_LLM 设为 0
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://opencode.ai/inference/go/openai/v1}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      REASON_MODEL: ${REASON_MODEL:-deepseek-v4.1-flash}
      ZHIPU_BASE_URL: ${ZHIPU_BASE_URL:-https://opencode.ai/inference/go/openai/v1}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      REASON_SMALL_MODEL: ${REASON_SMALL_MODEL:-glm-5.3-flash}
      DEMO_STEP_DELAY_MS: ${DEMO_STEP_DELAY_MS:-350}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      # seed 生成的 PDF/扫描件：容器重建后 PDF 抽屉仍可用
      - datafiles:/workspace/data/files
      # prompt 缓存（可选，方便复用模型结果）
      - promptcache:/workspace/backend/.cache/prompts
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz').status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  pgdata:
  datafiles:
  promptcache:
